spring.application.name=backend
server.port=${PORT:8080}

spring.datasource.url=${MEDIFLOW_DB_URL:jdbc:mysql://localhost:3306/mediflow_db}
spring.datasource.username=${MEDIFLOW_DB_USER:root}
spring.datasource.password=${MEDIFLOW_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${MEDIFLOW_DDL_AUTO:update}
spring.jpa.open-in-view=false

mediflow.cors.origins=${MEDIFLOW_FRONTEND_ORIGINS:http://localhost:5173,http://localhost:3000}
server.error.include-stacktrace=never
server.error.include-message=never
